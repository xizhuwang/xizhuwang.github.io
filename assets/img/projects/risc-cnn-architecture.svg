<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d"><title id="t">RISC CPU and CNN accelerator</title><desc id="d">Overview based on the public RTL and README: a 32-bit CPU with instruction/data memory and registers, sleep-mode controller, and CNN controller/datapath. Start initiates inference; Done and Predict Label return to the controller, which writes RF0 and resumes the CPU.</desc><defs><linearGradient id="p" x2="1" y2="1"><stop stop-color="#253453"/><stop offset="1" stop-color="#171e34"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#372848"/><stop offset="1" stop-color="#201c34"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#96c9ff"/></marker></defs><g font-family="Arial,sans-serif"><rect x="40" y="24" width="640" height="148" rx="20" fill="url(#p)" stroke="#6aa3d9" stroke-width="2"/><text x="70" y="70" fill="#d1edff" font-size="32" font-weight="600">32-bit RISC CPU</text><text x="70" y="114" fill="#b0c6e2" font-size="24">PC · instruction memory · data memory</text><text x="70" y="147" fill="#b0c6e2" font-size="24">Register file · instruction control</text><path d="M270 177V213" fill="none" stroke="#96c9ff" stroke-width="3" marker-end="url(#a)"/><path d="M450 214V181" fill="none" stroke="#96c9ff" stroke-width="3" marker-end="url(#a)"/><rect x="153" y="222" width="414" height="84" rx="16" fill="url(#c)" stroke="#be9ce4" stroke-width="2"/><text x="360" y="274" text-anchor="middle" fill="#e6d5ff" font-size="30" font-weight="600">Sleep-mode controller</text><g fill="none" stroke="#96c9ff" stroke-width="3" marker-end="url(#a)"><path d="M240 312V362"/><path d="M480 360V317"/></g><text x="174" y="341" fill="#c3ddfa" font-size="23">Start</text><text x="506" y="333" fill="#c3ddfa" font-size="21">Done +</text><text x="506" y="357" fill="#c3ddfa" font-size="21">label</text><rect x="40" y="374" width="640" height="152" rx="20" fill="url(#c)" stroke="#a289ce" stroke-width="2"/><text x="70" y="420" fill="#e3d2ff" font-size="32" font-weight="600">CNN accelerator</text><text x="70" y="460" fill="#b6b9d9" font-size="24">Controller + datapath</text><text x="70" y="502" fill="#cdd7ec" font-size="26">MAC · ReLU · Comparator</text></g></svg>